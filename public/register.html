<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Event Registration | EventHub</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- ==============================
         NAVIGATION
    =============================== -->

    <header class="navbar">

        <div class="container navbar-container">

            <a
                href="index.html"
                class="logo"
            >
                EventHub
            </a>


            <nav class="nav-links">

                <a href="index.html">
                    Home
                </a>

                <a href="events.html">
                    Events
                </a>

                <a href="index.html#about">
                    About
                </a>

                <a href="index.html#contact">
                    Contact
                </a>

                <a
                    href="admin/login.html"
                    class="admin-link"
                >
                    Admin
                </a>

            </nav>

        </div>

    </header>



    <!-- ==============================
         REGISTRATION SECTION
    =============================== -->

    <main class="registration-page">

        <div class="container">


            <div class="registration-card">


                <!-- Heading -->

                <div class="registration-heading">

                    <h1>
                        Event Registration
                    </h1>

                    <p>
                        Complete the form below to register
                        for this event.
                    </p>

                </div>



                <!-- Selected Event -->

                <div
                    id="selectedEvent"
                    class="selected-event"
                >

                    Loading event information...

                </div>



                <!-- Registration Form -->

                <form id="registrationForm">


                    <!-- Name -->

                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>



                    <!-- Email -->

                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email address"
                            required
                        >

                    </div>



                    <!-- Phone -->

                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Enter your phone number"
                            required
                        >

                    </div>



                    <!-- Submit -->

                    <button
                        type="submit"
                        class="primary-btn"
                    >
                        Register for Event
                    </button>


                </form>



                <!-- Registration Message -->

                <div
                    id="registrationMessage"
                    class="registration-message"
                ></div>



                <!-- Back to Events -->

                <div class="back-section">

                    <a
                        href="events.html"
                        class="secondary-btn"
                    >
                        ← Back to Events
                    </a>

                </div>


            </div>

        </div>

    </main>



    <!-- ==============================
         FOOTER
    =============================== -->

    <footer class="footer">

        <div class="container footer-content">

            <p>
                © 2026 EventHub. All rights reserved.
            </p>

            <p>
                Event Management System
            </p>

        </div>

    </footer>



    <script src="js/register.js"></script>

</body>

</html>
