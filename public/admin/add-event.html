<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Event | EventHub</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>


<body>


    <!-- ==============================
         NAVIGATION
    =============================== -->

    <header class="navbar">

        <div class="container navbar-container">

            <a
                href="../index.html"
                class="logo"
            >
                EventHub
            </a>


            <nav class="nav-links">

                <a href="../index.html">
                    Home
                </a>

                <a href="../events.html">
                    Events
                </a>

                <a href="dashboard.html">
                    Dashboard
                </a>

                <a href="login.html">
                    Logout
                </a>

            </nav>

        </div>

    </header>



    <!-- ==============================
         ADD EVENT
    =============================== -->

    <main class="admin-dashboard">

        <div class="container">


            <div class="dashboard-heading">

                <h1>
                    Add New Event
                </h1>

                <p>
                    Create a new event for participants
                    to discover and register.
                </p>

            </div>



            <div class="admin-form-card">


                <form id="addEventForm">


                    <!-- Event Title -->

                    <div class="form-group">

                        <label for="title">
                            Event Title
                        </label>

                        <input
                            type="text"
                            id="title"
                            name="title"
                            placeholder="Enter event title"
                            required
                        >

                    </div>



                    <!-- Date -->

                    <div class="form-group">

                        <label for="date">
                            Event Date
                        </label>

                        <input
                            type="date"
                            id="date"
                            name="date"
                            required
                        >

                    </div>



                    <!-- Time -->

                    <div class="form-group">

                        <label for="time">
                            Event Time
                        </label>

                        <input
                            type="text"
                            id="time"
                            name="time"
                            placeholder="Example: 10:00 AM"
                            required
                        >

                    </div>



                    <!-- Venue -->

                    <div class="form-group">

                        <label for="venue">
                            Venue
                        </label>

                        <input
                            type="text"
                            id="venue"
                            name="venue"
                            placeholder="Enter event venue"
                            required
                        >

                    </div>



                    <!-- Maximum Participants -->

                    <div class="form-group">

                        <label for="maxParticipants">
                            Maximum Participants
                        </label>

                        <input
                            type="number"
                            id="maxParticipants"
                            name="maxParticipants"
                            min="1"
                            placeholder="Example: 100"
                            required
                        >

                    </div>



                    <!-- Description -->

                    <div class="form-group">

                        <label for="description">
                            Event Description
                        </label>

                        <textarea
                            id="description"
                            name="description"
                            rows="6"
                            placeholder="Describe the event..."
                            required
                        ></textarea>

                    </div>



                    <!-- Submit -->

                    <button
                        type="submit"
                        class="primary-btn"
                    >
                        Add Event
                    </button>


                </form>



                <!-- Message -->

                <div
                    id="eventMessage"
                    class="registration-message"
                ></div>


            </div>



            <!-- Back -->

            <div class="back-section">

                <a
                    href="dashboard.html"
                    class="secondary-btn"
                >
                    ← Back to Dashboard
                </a>

            </div>


        </div>

    </main>



    <!-- ==============================
         FOOTER
    =============================== -->

    <footer class="footer">

        <div class="container footer-content">

            <p>
                © 2026 EventHub. All rights reserved.
            </p>

            <p>
                Event Management System
            </p>

        </div>

    </footer>



    <script src="../js/admin-add-event.js"></script>

</body>

</html>
