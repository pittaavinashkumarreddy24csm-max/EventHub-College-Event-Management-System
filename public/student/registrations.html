<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Registrations - EventHub</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <div class="container nav-container">

            <div class="logo">
                EventHub
            </div>

            <div class="nav-links">

                <a href="../index.html">
                    Home
                </a>

                <a href="../events.html">
                    Events
                </a>

                <a href="../index.html#about">
                    About
                </a>

                <a href="../index.html#contact">
                    Contact
                </a>

            </div>

        </div>

    </nav>


    <!-- ================= MAIN ================= -->

    <main>

        <section class="dashboard-section">

            <div class="container">

                <div class="dashboard-header">

                    <div>

                        <h1>
                            My Registrations
                        </h1>

                        <p>
                            View the events you have registered for.
                        </p>

                    </div>

                    <div>

                        <a
                            href="dashboard.html"
                            class="secondary-btn"
                        >
                            Back to Dashboard
                        </a>

                    </div>

                </div>


                <!-- ================= REGISTRATIONS ================= -->

                <div
                    id="registrationsContainer"
                    class="dashboard-card"
                >

                    <p>
                        Loading your registrations...
                    </p>

                </div>

            </div>

        </section>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <div class="container">

            <p>
                © 2026 EventHub. All rights reserved.
            </p>

        </div>

    </footer>


    <script src="../js/student-registrations.js"></script>

</body>

</html>
