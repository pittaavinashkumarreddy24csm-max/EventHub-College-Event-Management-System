<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Student Sign In - EventHub</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>


<body>

    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <div class="container nav-container">

            <a
                href="../index.html"
                class="logo"
            >
                EventHub
            </a>


            <nav class="nav-links">

                <a href="../index.html">
                    Home
                </a>

                <a href="../events.html">
                    Events
                </a>

                <a href="../index.html#about">
                    About
                </a>

                <a href="../index.html#contact">
                    Contact
                </a>

            </nav>

        </div>

    </header>


    <!-- ================= STUDENT LOGIN ================= -->

    <section class="admin-login-page">

        <div class="container">

            <div class="admin-login-card">


                <div class="admin-login-heading">

                    <p class="section-label">
                        STUDENT ACCOUNT
                    </p>

                    <h1>
                        Sign In
                    </h1>

                    <p>
                        Sign in to your EventHub student account
                        to continue.
                    </p>

                </div>


                <!-- LOGIN FORM -->

                <form id="studentLoginForm">


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <!-- LOGIN BUTTON -->

                    <button
                        type="submit"
                        class="primary-btn admin-login-btn"
                    >
                        Sign In
                    </button>


                </form>


                <!-- MESSAGE -->

                <div
                    id="loginMessage"
                    class="login-message"
                ></div>


                <!-- CREATE ACCOUNT -->

                <p
                    style="
                        text-align:center;
                        margin-top:20px;
                        color:#6b7280;
                    "
                >

                    Don't have an account?

                    <a
                        href="register.html"
                        style="
                            color:#2563eb;
                            font-weight:600;
                        "
                    >
                        Create Account
                    </a>

                </p>


            </div>

        </div>

    </section>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <div class="container">

            <p>
                © 2026 EventHub. All rights reserved.
            </p>

        </div>

    </footer>


    <script src="../js/student-login.js"></script>

</body>

</html>
