<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Events | EventHub</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- ==============================
         NAVIGATION
    =============================== -->

    <header class="navbar">

        <div class="container navbar-container">

            <a
                href="index.html"
                class="logo"
            >
                EventHub
            </a>


            <nav class="nav-links">

                <a href="index.html">
                    Home
                </a>

                <a href="events.html">
                    Events
                </a>

                <a href="index.html#about">
                    About
                </a>

                <a href="index.html#contact">
                    Contact
                </a>

                <a
                    href="admin/login.html"
                    class="admin-link"
                >
                    Admin
                </a>

            </nav>

        </div>

    </header>



    <!-- ==============================
         EVENTS SECTION
    =============================== -->

    <main>

        <section class="events-section">

            <div class="container">


                <div class="section-heading">

                    <h2>
                        Upcoming Events
                    </h2>

                    <p>
                        Explore and register for
                        upcoming events.
                    </p>

                </div>



                <!-- Events will be loaded here -->

                <div
                    id="eventsContainer"
                    class="event-grid"
                >

                    <p>
                        Loading events...
                    </p>

                </div>


            </div>

        </section>

    </main>



    <!-- ==============================
         FOOTER
    =============================== -->

    <footer class="footer">

        <div class="container footer-content">

            <p>
                © 2026 EventHub. All rights reserved.
            </p>

            <p>
                Event Management System
            </p>

        </div>

    </footer>



    <script src="js/events.js"></script>

</body>

</html>
